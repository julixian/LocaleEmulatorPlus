[workspace]
members = ["LEPCommon", "LEPHelper", "LEPShellExt", "LEP"]

[workspace.package]
version = "3.0.1"
standard = "c++23"
license = "GPL-3.0-or-later"
mcpp = ">=2026.10.10.1"

[workspace.toolchain]
windows = "llvm@23.1.3"

[workspace.build]
cxx_runtime = "self-contained"
cxxflags = [
  "-finput-charset=UTF-8",
  "-fexec-charset=UTF-8",
]

[workspace.target.x86_64-windows-msvc]
sysroot = "msvc@14.44"

[workspace.target.i686-windows-msvc]
sysroot = "msvc@14.44"

[workspace.target.windows.build]
defines = [
  "UNICODE",
  "_UNICODE",
  "WIN32_LEAN_AND_MEAN",
  "NOMINMAX",
  "_CRT_SECURE_NO_WARNINGS",
  "_WIN32_WINNT=0x0601",
  "WINVER=0x0601",
  "NTDDI_VERSION=0x06010000",
]
ldflags = [
  "-Wl,/INCREMENTAL:NO",
]

[workspace.target.i686-windows-msvc.build]
dialect_cxxflags = ["-D__cpp_impl_coroutine=201902L"]

[workspace.profile.release]
opt = 3
debug = true
lto = true

[workspace.profile.fast-release]
opt = 0
debug = true
lto = false
